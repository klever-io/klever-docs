name: Security Scan

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '30 2 * * 1' # Weekly on Monday at 2:30 AM

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Fails the job on any high or critical advisory. An advisory with no
      # fixed version can be accepted in package.json under
      # pnpm.auditConfig.ignoreGhsas, with the reason in the PR that adds it.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

      # pnpm outdated needs node_modules, and should still report when the
      # audit step above fails.
      - name: Install dependencies
        if: always()
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for outdated dependencies
        if: always()
        run: |
          echo "📦 Checking for outdated packages..."
          pnpm outdated || true
